<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar documento - QC Digital</title>
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:#f2f3f5; color:#1a1a1a; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .tarjeta{ max-width:420px; width:100%; background:#fff; border-radius:10px; border:1px solid #d8dbe2; overflow:hidden; }
  .cabecera{ background:#0d1526; padding:18px 20px; display:flex; align-items:center; gap:10px; }
  .cabecera img{ height:22px; display:block; }
  .cabecera span{ color:#fff; font-size:13px; font-weight:600; }
  .cuerpo{ padding:24px 20px; text-align:center; }
  .icono{ width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:28px; }
  .icono.ok{ background:#e5f3e8; color:#2e7d32; }
  .icono.err{ background:#fbe9e7; color:#c0392b; }
  h1{ font-size:16px; font-weight:700; margin:0 0 4px; }
  .estado.ok{ color:#2e7d32; }
  .estado.err{ color:#c0392b; }
  .detalle{ text-align:left; margin-top:18px; border-top:1px solid #eceef1; padding-top:16px; }
  .fila{ display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:13px; }
  .fila .lbl{ color:#6e7480; }
  .fila .val{ font-weight:600; text-align:right; }
  .boton{ display:block; margin-top:18px; background:#0d1526; color:#fff; text-decoration:none; padding:11px; border-radius:8px; font-size:13px; font-weight:600; text-align:center; }
  .boton:active{ opacity:.85; }
  .pie{ font-size:10.5px; color:#9aa1ad; text-align:center; margin-top:16px; }
  .cargando{ font-size:13px; color:#6e7480; padding:20px 0; }
</style>
</head>
<body>

<div class="tarjeta">
  <div class="cabecera">
    <span>QC Digital &middot; Verificaci&oacute;n de documentos</span>
  </div>
  <div class="cuerpo" id="cuerpo">
    <p class="cargando">Verificando c&oacute;digo...</p>
  </div>
</div>

<script>
/* ============================================================
   VERIFICAR.HTML - Cartilla publica de verificacion
   QC Digital

   No requiere MARCA.js ni autenticacion: pagina publica, debe
   quedar excluida de Cloudflare Access (regla de Bypass para
   /verificar.html), porque su unico proposito es que CUALQUIERA
   con el QR pueda confirmar un documento sin loguearse.

   Fuente de datos: los Sheets "QC Digital - Repositorio" publicados
   como CSV (Archivo > Compartir > Publicar en la Web > CSV).
   Hay mas de un Sheet activo (uno por dispositivo/navegador que
   genera reportes) asi que se consultan todos en paralelo y se
   busca el correlativo en cualquiera de ellos.
   ============================================================ */

// REEMPLAZAR con los links "Publicar en la Web" de cada Sheet (formato CSV).
const CSV_URLS = [
  'https://docs.google.com/spreadsheets/d/e/2PACX-1vReDyKG1jxm1jxBQ5sBL3zZ1_48yV9ArJw-RvvKsUjhcZiRlEY7blEyitogstPWOzszJsHXEQuaWR_2/pub?gid=0&single=true&output=csv',
  'https://docs.google.com/spreadsheets/d/e/2PACX-1vSsjZAph1VaFQ1OhZ0mup3qdgNFEhK88orVmLU9MA-ZKr9atVBb93Oa_tWkeZgI5INGi6J3ku7EV3uy/pub?gid=0&single=true&output=csv'
];

const COLS = ['fecha','hora','tipo','correlativo','empresa','generadoPor','nombreArchivo','linkDrive'];

function parsearCSV(texto){
  const filas = [];
  let fila = [], campo = '', enComillas = false;
  for(let i = 0; i < texto.length; i++){
    const c = texto[i];
    if(enComillas){
      if(c === '"'){
        if(texto[i+1] === '"'){ campo += '"'; i++; }
        else enComillas = false;
      } else campo += c;
    } else {
      if(c === '"') enComillas = true;
      else if(c === ','){ fila.push(campo); campo = ''; }
      else if(c === '\r'){ /* ignorar */ }
      else if(c === '\n'){ fila.push(campo); filas.push(fila); fila = []; campo = ''; }
      else campo += c;
    }
  }
  if(campo !== '' || fila.length){ fila.push(campo); filas.push(fila); }
  return filas.filter(f => f.length > 1);
}

async function buscarEnSheet(url, codigo){
  try{
    const resp = await fetch(url, { cache: 'no-store' });
    if(!resp.ok) return null;
    const texto = await resp.text();
    const filas = parsearCSV(texto);
    for(let i = 1; i < filas.length; i++){ // fila 0 = encabezados
      const f = filas[i];
      if((f[3] || '').trim().toUpperCase() === codigo.toUpperCase()){
        const obj = {};
        COLS.forEach((k, idx) => obj[k] = f[idx] || '');
        return obj;
      }
    }
  }catch(e){ console.warn('No se pudo leer un Sheet de verificacion.', e); }
  return null;
}

async function verificar(){
  const params = new URLSearchParams(location.search);
  const codigo = (params.get('c') || params.get('codigo') || '').trim();
  const cuerpo = document.getElementById('cuerpo');

  if(!codigo){
    cuerpo.innerHTML =
      '<div class="icono err">&times;</div>' +
      '<h1 class="estado err">Falta el codigo</h1>' +
      '<p style="font-size:13px;color:#6e7480;">El link no incluye un codigo de verificacion valido.</p>';
    return;
  }

  const resultados = await Promise.all(CSV_URLS.map(u => buscarEnSheet(u, codigo)));
  const encontrado = resultados.find(r => r);

  if(!encontrado){
    cuerpo.innerHTML =
      '<div class="icono err">&times;</div>' +
      '<h1 class="estado err">No verificado</h1>' +
      '<p style="font-size:13px;color:#6e7480;">No se encontr&oacute; ning&uacute;n documento con el c&oacute;digo <strong>'+codigo+'</strong>.</p>';
    return;
  }

  cuerpo.innerHTML =
    '<div class="icono ok">&check;</div>' +
    '<h1 class="estado ok">Documento verificado</h1>' +
    '<p style="font-size:13px;color:#6e7480;">'+encontrado.tipo+'</p>' +
    '<div class="detalle">' +
      '<div class="fila"><span class="lbl">Generado por</span><span class="val">'+encontrado.generadoPor+'</span></div>' +
      '<div class="fila"><span class="lbl">Empresa</span><span class="val">'+encontrado.empresa+'</span></div>' +
      '<div class="fila"><span class="lbl">Fecha</span><span class="val">'+encontrado.fecha+' &middot; '+encontrado.hora+'</span></div>' +
      '<div class="fila"><span class="lbl">C&oacute;digo</span><span class="val">'+codigo+'</span></div>' +
    '</div>' +
    (encontrado.linkDrive ? '<a class="boton" href="'+encontrado.linkDrive+'" target="_blank" rel="noopener">Ver documento original</a>' : '');
}

verificar();
</script>

<p class="pie" style="position:fixed; bottom:10px; left:0; right:0;">QC Digital &middot; Industry Quality Suite</p>

</body>
</html>
