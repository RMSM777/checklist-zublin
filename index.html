<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QC Digital</title>
<script>
/* Si esto es un enlace de recuperacion de contraseña de Supabase
   (#access_token=...&type=recovery), hay que mandarlo a login.html
   CONSERVANDO el fragmento — el redirect normal de esta pagina
   (location.replace('home.html') / meta refresh de abajo) lo pierde
   porque apunta a una URL relativa sin fragmento, y el enlace queda
   inutil. Tiene que ir antes que el meta refresh para ganarle. */
if(/(^|[#&])type=recovery(&|$)/.test(location.hash) || /(^|[#&])error=/.test(location.hash)){
  location.replace('login.html' + location.hash);
}
</script>
<meta http-equiv="refresh" content="0; url=home.html">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1526">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:#0a0f1c; color:#e7ecf5; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  a{ color:#f5851f; }
</style>
</head>
<body>
<!--
  index.html es SOLO un redirect a home.html. NO agregar contenido real
  aqui: home.html es la unica fuente del menu (dark mode, hub de
  borradores, version, etc. viven todos ahi). Duplicar contenido en
  este archivo fue justamente el bug que causo que index.html quedara
  desactualizado. Si necesitas cambiar el menu, edita home.html.
-->
<script>location.replace('home.html');</script>
<noscript>Redirigiendo... si no avanza, <a href="home.html">entra aquí</a>.</noscript>
</body>
</html>
